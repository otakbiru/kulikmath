<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan & Bank Soal Matematika</title>
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./scr/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./scr/icons/icon-192.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="./scr/style.css">
</head>

<body>

    <!-- Sticky Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="./index.html" class="brand">📐 Ruang Matematika</a>
            <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="container">
        <div class="page-header">
            <h1 style="font-size: 1.4rem; margin-bottom: 0.35rem;">Arsip Materi & Bank Soal Matematika</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">
                Pilih topik bahasan untuk mempelajari ringkasan materi, latihan soal tingkat Dasar, SNBT, hingga
                HOTS/Olimpiade.
            </p>
        </div>

        <!-- Kolom Pencarian -->
        <input type="text" id="search-input" class="search-box"
            placeholder="🔍 Cari topik atau isi soal (contoh: bola, dadu, SNBT, maksimum...)">

        <!-- Daftar Topik per Bidang (Diisi otomatis dari scr/script.js) -->
        <div id="topic-list-container"></div>
    </main>

    <script src="./scr/search-index.js"></script>
    <script src="./scr/script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>

</html>
